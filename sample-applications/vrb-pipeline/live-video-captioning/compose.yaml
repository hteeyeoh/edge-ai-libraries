  mediamtx:
    image: bluenviron/mediamtx:1.11.3
    container_name: mediamtx
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,video-ingestion,lvc-dashboard,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,mediamtx,coturn,video-ingestion,lvc-dashboard,${NO_PROXY}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
      - MTX_LOGLEVEL=info
      - MTX_HLS=no
      - MTX_RTMP=no
      - MTX_SRT=no
      - MTX_RTMP=no
      - MTX_HLS=no
      - MTX_SRT=no
      - MTX_WEBRTCTRACKGATHERTIMEOUT=30s
      - MTX_WEBRTCADDRESS=:8889
      - MTX_WEBRTCICESERVERS2_0_URL=turn:${HOST_IP:-localhost}:3478
      - MTX_WEBRTCICESERVERS2_0_USERNAME=${MTX_WEBRTCICESERVERS2_0_USERNAME:-localhost}
      - MTX_WEBRTCICESERVERS2_0_PASSWORD=${MTX_WEBRTCICESERVERS2_0_PASSWORD:-localpass}
    ports:
      - "${WHIP_SERVER_PORT}:8889"
      - "8189:8189"
      - "9997:9997"
    restart: unless-stopped
    networks:
      - app_network

  coturn:
    image: coturn/coturn:latest
    container_name: coturn
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,video-ingestion,lvc-dashboard,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,mediamtx,coturn,video-ingestion,lvc-dashboard,${NO_PROXY}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
    ports:
      - "3478:3478/udp"
    command: [ "-v" ] # Verbose mode for logging
    networks:
      - app_network

  lvc-dashboard:
    build: ./dashboard
    container_name: lvc-dashboard
    environment:
      - no_proxy=localhost,127.0.0.1,mediamtx,coturn,video-ingestion,lvc-dashboard,${no_proxy}
      - NO_PROXY=localhost,127.0.0.1,mediamtx,coturn,video-ingestion,lvc-dashboard,${NO_PROXY}
      - http_proxy=$http_proxy
      - HTTP_PROXY=$http_proxy
      - https_proxy=$https_proxy
      - HTTPS_PROXY=$https_proxy
      - DASHBOARD_PORT=4173
      - METADATA_FILE=/tmp/results.jsonl
      - METADATA_POLL_SECONDS=${METADATA_POLL_SECONDS:-1}
      - WEBRTC_PEER_ID=${WEBRTC_PEER_ID:-stream}
      - SIGNALING_URL=http://${HOST_IP:-localhost}:${WHIP_SERVER_PORT:-8889}
      # GPU metrics - reads from host qmassa output at /tmp/qmassa-stats.json
      - QMASSA_ENABLED=${QMASSA_ENABLED:-true}
      - QMASSA_JSON_FILE=/tmp/qmassa-stats.json
      - QMASSA_POLL_INTERVAL_MS=${QMASSA_POLL_INTERVAL_MS:-1000}
    volumes:
      - "/tmp:/tmp:ro"
      - "./ov_models:/app/ov_models:ro"
      - "./ov_detection_models:/app/ov_detection_models:ro"
    ports:
      - "${DASHBOARD_PORT:-4173}:4173"
    depends_on:
      - video-ingestion
      - mediamtx
    networks:
      - app_network

volumes:
  vol_evam_pipeline_root:
    driver: local
    driver_opts:
      type: tmpfs
      device: tmpfs
  # ov-models:
  #   driver: local
  # vdms-db:
  #   driver: local

networks:
  app_network:
    driver: bridge
