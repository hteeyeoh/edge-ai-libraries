services:
  nginx:
    image: nginx:latest
    ports:
      - "8102:80"
    volumes:
      - ../nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - chatqna-core
      - chatqna-core-ui
  chatqna-core:
    image: chatqna:trace
    profiles:
      - DEFAULT
    container_name: chatqna-core
    build:
      context: ../
      dockerfile: docker/Dockerfile
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
      HF_ACCESS_TOKEN: ${HF_ACCESS_TOKEN}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID}
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID}
      LLM_MODEL_ID: ${LLM_MODEL_ID}
      OTLP_ENDPOINT: ${OTLP_ENDPOINT}
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: ${OTLP_ENDPOINT}/v1/traces
      OTEL_SERVICE_NAME: ${OTLP_SERVICE_NAME}
      OTEL_SERVICE_ENV: ${OTLP_SERVICE_ENV}
      OTEL_SERVICE_VERSION: ${OTEL_SERVICE_VERSION}
      OTEL_METRICS_EXPORTER: otlp
      OTEL_TRACES_EXPORTER: otlp
      REQUESTS_CA_BUNDLE: /etc/ssl/certs/ca-certificates.crt
    ports:
      - "8888:8888"
    volumes:
      - "${MODEL_CACHE_PATH}:/tmp/model_cache"
      - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates
      - /etc/ssl/certs:/etc/ssl/certs
    group_add:
      - ${GID}

  chatqna-core-gpu:
    image: ${REGISTRY:-}chatqna:${BACKEND_TAG:-latest}
    profiles:
      - GPU-DEVICE
    container_name: chatqna-core-gpu
    build:
      context: ../
      dockerfile: docker/Dockerfile
      args:
        USE_GPU: "true"
        GPU_TYPE: "dgpu"
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
      HF_ACCESS_TOKEN: ${HF_ACCESS_TOKEN}
      EMBEDDING_MODEL_ID: ${EMBEDDING_MODEL_ID}
      RERANKER_MODEL_ID: ${RERANKER_MODEL_ID}
      LLM_MODEL_ID: ${LLM_MODEL_ID}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE}
      RERANKER_DEVICE: ${RERANKER_DEVICE}
      LLM_DEVICE: ${LLM_DEVICE}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${RENDER_DEVICE_GID}
      - ${GID}
    ports:
      - "8888:8888"
    volumes:
      - "${MODEL_CACHE_PATH}:/tmp/model_cache"

  chatqna-core-ui:
    image: ${REGISTRY:-}chatqna-ui:${UI_TAG:-latest}
    container_name: chatqna-core-ui
    build:
      context: ../ui/
      dockerfile: Dockerfile
    environment:
      http_proxy: ${http_proxy}
      https_proxy: ${https_proxy}
      no_proxy: ${no_proxy}
      APP_BACKEND_URL: ${APP_BACKEND_URL}
    ports:
      - "5173:80"

networks:
  default:
    driver: bridge
