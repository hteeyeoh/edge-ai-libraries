# ChatQnA Core Application Configuration Template
# Customize the values below to suit your application's requirements.

model_settings:
  # Runtime for model serving.
  # Options: "ollama", "openvino"
  MODEL_RUNTIME: "openvino"

  # Embedding model used for vectorizing input text.
  # Example: "BAAI/bge-small-en-v1.5"
  EMBEDDING_MODEL_ID: "BAAI/bge-small-en-v1.5"

  # Reranker model used to reorder retrieved results based on relevance.
  # Example: "BAAI/bge-reranker-base"
  RERANKER_MODEL_ID: "BAAI/bge-reranker-base"

  # Large Language Model (LLM) used to generate responses.
  # Example: "microsoft/Phi-3.5-mini-instruct"
  LLM_MODEL_ID: "Intel/neural-chat-7b-v3-3"

  # Prompt template used by the assistant to generate answers.
  # Ensure placeholders like {history}, {context} and {question} are preserved.
  # Optional: Adjust the template to match your model's requirements.
  #           If did not provde, will use the default template defined in the application.
  PROMPT_TEMPLATE: >
    ### System:
    You are the "MegaRetail Navigator," a helpful, efficient store assistant.
    Your goal is to guide customers to products and explain store policies accurately.

    ### Rules for your response:
    1. **Context is Supreme:** If the Conversation History contradicts the provided Context, ALWAYS follow the Context. The Context contains the most up-to-date store shelf information.
    2. **Strict Grounding:** Answer ONLY using the provided context.
    3. **Paragraph Format:** Provide your answer as a single, cohesive paragraph (maximum 3-4 sentences). Do NOT use bullet points, bold headers, or lists.
    3. **Be Scannable:** Use bullet points for lists. Avoid long paragraphs.
    4. **Directional Help:** If the context mentions a "Wing" (North, South, East, West), include it to help the user navigate.
    5. **Ambiguity:** If the user asks for a broad category (e.g., "Apples"), briefly list the varieties available in the context.
    5. **Fallback:** If the answer is not in the context, say: "I'm sorry, I couldn't find that specific item in our digital directory. Please visit our **Customer Service Desk (Ground Floor, North Gate)** for further assistance."

    ### Conversation History:
    {history}

    ### Context:
    {context}

    ### User Question:
    {question}

    ### Assistant:

  # Optional: Maximum number of tokens in the model's response.
  # Maximum token 1024. Not exceeding this limit to avoid errors.
  MAX_TOKENS: 1024

device_settings:
  # Specify the device for each model. Options: "CPU", "GPU"
  EMBEDDING_DEVICE: "CPU"
  RERANKER_DEVICE: "CPU"
  LLM_DEVICE: "CPU"

ingestion_settings:
  # Chunking strategy for splitting documents.
  # Options: "recursive" (default, general prose), "fixed" (uniform dense text),
  #          "token" (LLM-token-aware), "section" (splits on ━━━/════/## headers — best for structured store docs)
  CHUNKING_STRATEGY: "section"
  # Base chunking used for semantic retrieval.
  CHUNK_SIZE: 1200
  CHUNK_OVERLAP: 200

retrieval_settings:
  # Whether to enable reranking of retrieved results.
  ENABLE_RERANK: False
  # Maximum number of docs returned by reranker before final top_k slicing.
  RERANK_TOP_N: 2
  # Search method for retrieval.
  # Options:
  # - "similarity": standard top-k vector similarity
  # - "similarity_score_threshold": return docs above score threshold
  # - "mmr": Maximal Marginal Relevance for diversity
  # - "bm25": lexical keyword-based retriever over ingested chunks
  SEARCH_METHOD: "similarity"
  # Number of vectorstore results fetched for retrieval.
  FETCH_K: 2
  # Used when SEARCH_METHOD="similarity_score_threshold". Range: 0.0 to 1.0
  # Lower value increases recall, higher value increases precision.
  SIMILARITY_SCORE_THRESHOLD: 0.35
  # Number of neighboring chunks to include before and after each retrieved seed chunk.
  CONTEXT_WINDOW_NEIGHBORS: 0
  # Whether to use LLMChainExtractor for condensing questions before retrieval, which can improve relevance for long or complex questions.
  ENABLE_LLM_CHAIN_EXTRACTOR: False
  # Enable the LLM to condense the user's question before retrieval, which can improve retrieval relevance for long or complex questions.
  ENABLE_LLM_CONDENSE_QUESTION: False

# Notes:
# - Ensure all model IDs are valid and accessible.
# - Prompt template must be properly formatted and include required placeholders.
# - Adjust device settings based on your system's hardware capabilities.
