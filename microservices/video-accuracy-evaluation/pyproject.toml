[tool.poetry]
name = "video-accuracy-evaluation"
version = "0.1"
description = "A sample evaluation tool designed to measure the accuracy of video summary outputs generated by multimodal LLM-based video summarization applications. It provides metrics and insights to assess the quality and relevance of generated summaries against reference content."
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
beautifulsoup4 = "4.13.5"
fastapi = "0.116.1"
markdown = "3.9"
python-multipart = ">=0.0.18"
pydantic-settings = "2.10.1"
rouge-score = "^0.1.2"
sentence-transformers = "5.0.0"
uvicorn = "0.35.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-mock = "^3.14.0"
coverage = "^7.6.4"
pytest-asyncio = "^0.24.0"
httpx = "^0.27.2"

[tool.poetry.group.cpu.dependencies]
torch = { version = "^2.7.1", source = "pytorch-cpu" }

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[tool.pytest.ini_options]
asyncio_default_fixture_loop_scope = "module"

[build-system]
requires = ["poetry-core>=1.8.3"]
build-backend = "poetry.core.masonry.api"
